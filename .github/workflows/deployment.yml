name: PostgreSQL deployment
on:
  push:
    branches: [main, fix/dokploy-postgresql]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and verify container with PostgreSQL
        run: bash tests/docker_smoke.sh
