<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - Finanza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center text-center p-6">
    <div class="w-24 h-24 bg-slate-200 rounded-full flex items-center justify-center mb-6">
        <span class="material-icons text-5xl text-slate-400">wifi_off</span>
    </div>
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Estás desconectado</h1>
    <p class="text-slate-500 mb-8 max-w-xs">No tienes conexión a internet. Revisa tu señal e intenta nuevamente.</p>
    <button onclick="window.location.reload()" class="bg-indigo-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-indigo-200 active:scale-95 transition-all">
        Reintentar
    </button>
</body>
</html>
